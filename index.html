<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT Chat - Green Theme</title>
    <meta name="description" content="ChatGPT Clone with Green Theme - Firebase Auth & OpenAI API">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"> </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <style>
        /* ===== ตั้งค่าพื้นฐาน ===== */
        :root {
            --bg: #ffffff;
            --sidebar: #f9f9f9;
            --card: #ffffff;
            --input: #f4f4f4;
            --text: #0d0d0d;
            --text2: #666666;
            --border: rgba(0, 0, 0, 0.1);
            --hover: #ececec;
            --user-bubble: #f4f4f4;
            --btn-primary: #000000;
            --btn-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* ===== ซ่อน Scrollbar ===== */
        .no-sb::-webkit-scrollbar {
            display: none;
        }

        .no-sb {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ===== Login Screen ===== */
        #login-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            transition: opacity .4s;
        }

        #login-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        #ai-response-box ul {
            list-style-type: disc !important;
            /* บังคับให้เป็นจุดกลมทึบ */
            padding-left: 40px !important;
            /* ดันข้อความเข้าไปให้จุดไม่ตกขอบ */
            margin-bottom: 16px;
        }

        #ai-response-box li {
            margin-bottom: 8px;
            /* เว้นระยะห่างระหว่างแต่ละข้อ */
        }

        #ai-response-box hr {
            border: 0;
            /* ลบขอบเดิมทิ้ง */
            border-top: 1px solid #e0e0e0;
            /* ใส่เส้นสีเทาอ่อนๆ บางๆ 1px */
            margin: 24px 0;
            /* ดันระยะห่างข้างบนและข้างล่างของเส้น ให้ดูไม่อึดอัด */
        }

        /* จัดระยะห่างของหัวข้อไม่ให้ชิดเส้นเกินไป */
        #ai-response-box h2,
        #ai-response-box h3 {
            margin-top: 0;
            margin-bottom: 16px;
        }



        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .5);
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .login-card p {
            color: var(--text2);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .g-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: #333;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: transform .15s, box-shadow .15s;
        }

        .g-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(176, 228, 204, .25);
        }

        .g-btn img {
            width: 20px;
            height: 20px;
        }

        /* ===== API Key Modal ===== */
        #api-modal {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(9, 20, 19, .85);
            backdrop-filter: blur(8px);
        }

        #api-modal.show {
            display: flex;
        }

        .modal-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 36px 32px;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-card h2 {
            color: var(--text);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .modal-card p {
            color: var(--text2);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .modal-card input {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
            margin-bottom: 20px;
        }

        .modal-card input:focus {
            border-color: #515151;
        }

        .modal-card button {
            margin-top: 16px;
            width: 100%;
            background: var(--btn-primary);
            color: var(--btn-text);
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: opacity .2s;
        }

        .modal-card button:hover {
            opacity: 0.9;
        }

        /* ===== Sidebar ===== */
        #sidebar {
            width: 260px;
            background: var(--sidebar);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform .3s;
        }

        #sidebar .chat-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            transition: background .15s;
        }

        #sidebar .chat-item:hover,
        #sidebar .chat-item.active {
            background: var(--hover);
        }

        /* ===== Chat Messages ===== */
        .msg {
            display: flex;
            gap: 12px;
            padding: 16px 0;
            max-width: 780px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn .3s;
        }

        .msg.user {
            flex-direction: row-reverse;
        }

        .msg .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .msg.ai .avatar {
            border: 1px solid var(--border);
            background: #fff;
            color: #000;
        }

        .msg.user .avatar {
            background: var(--btn-primary);
            color: var(--btn-text);
        }

        .msg .bubble {
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            max-width: 85%;
        }

        .msg.ai .bubble {
            background: transparent;
            color: var(--text);
            padding: 4px 10px;
            width: 100%;
            max-width: none;
        }

        .msg.user .bubble {
            background: var(--user-bubble);
            color: var(--text);
        }

        /* ===== Markdown ภายใน Bubble ===== */
        .bubble h1,
        .bubble h2,
        .bubble h3,
        .bubble h4,
        .bubble h5,
        .bubble h6 {
            color: var(--text);
            margin: 16px 0 8px 0;
            font-weight: 600;
            line-height: 1.4;
        }

        .bubble h1 {
            font-size: 1.5em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .bubble h2 {
            font-size: 1.3em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .bubble h3 {
            font-size: 1.1em;
        }

        .bubble p {
            margin: 8px 0;
        }

        .bubble ul,
        .bubble ol {
            margin: 8px 0 8px 24px;
            padding-left: 16px;
        }

        .bubble ul {
            list-style-type: disc;
        }

        .bubble ol {
            list-style-type: decimal;
        }

        .bubble li {
            margin-bottom: 4px;
            line-height: 1.6;
        }

        .bubble hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 16px 0;
        }

        .bubble blockquote {
            border-left: 4px solid #555;
            padding-left: 12px;
            color: var(--text2);
            margin: 8px 0;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        .bubble table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 13px;
        }

        .bubble th,
        .bubble td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .bubble th {
            background: rgba(255, 255, 255, .05);
        }

        .bubble pre {
            background: #000;
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0;
            overflow-x: auto;
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .bubble code {
            font-family: 'Cascadia Code', 'Courier New', monospace;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .bubble pre code {
            background: transparent;
            padding: 0;
            border-radius: 0;
        }

        .bubble strong {
            color: var(--text);
            font-weight: 600;
        }

        .bubble a {
            color: #5b9ce6;
            text-decoration: underline;
        }

        /* ===== Typing Indicator ===== */
        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text);
            border-radius: 50%;
            margin: 0 2px;
            animation: blink 1.4s infinite both;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: .2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: .3;
            }

            40% {
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Model Dropdown ===== */
        #model-menu {
            display: none;
            position: absolute;
            top: 46px;
            left: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 200px;
            z-index: 20;
            padding: 6px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
        }

        #model-menu.show {
            display: block;
        }

        #model-menu div {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text);
            transition: background .15s;
        }

        #model-menu div:hover {
            background: var(--sidebar);
        }

        #model-menu div.selected {
            font-weight: 600;
        }

        #model-menu div.disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        #model-menu div.disabled:hover {
            background: transparent;
        }

        /* ===== Responsive ===== */
        @media(max-width:768px) {
            #sidebar {
                position: fixed;
                z-index: 50;
                height: 100%;
                transform: translateX(-100%);
            }

            #sidebar.open {
                transform: translateX(0);
            }

            .overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .4);
                z-index: 49;
            }

            .overlay.show {
                display: block;
            }
        }
    </style>
</head>

<body class="flex">
    <div id="login-screen">
        <div class="login-card">
            <div
                style="width:64px;height:64px;background:var(--accent);border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;">
                <svg width="32" height="32" fill="none" viewBox="0 0 24 24">
                    <path d="M12 2a7 7 0 017 7c0 3-2 5.4-4.8 6.5L15 22H9l.8-6.5C7 14.4 5 12 5 9a7 7 0 017-7z"
                        fill="#B0E4CC" />
                </svg>
            </div>
            <h1>AI CHAT</h1>
            <p>เข้าสู่ระบบเพื่อเริ่มสนทนากับ AI</p>
            <button class="g-btn" id="google-login-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
                Sign in with Google
            </button>
        </div>
    </div>

    <div id="api-modal">
        <div class="modal-card">
            <h2> ตั้งค่า API (API Settings)</h2>
            <p>กรุณาใส่ API Key ของคุณเพื่อเริ่มใช้งานระบบ (รองรับทั้ง OpenAI และ OpenRouter)</p>

            <div style="text-align: left;">
                <label style="font-size: 12px; color: var(--text2); margin-bottom: 4px; display: block;">API Key</label>
                <input type="password" id="api-key-input" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx">
            </div>
            <button id="save-api-key-btn">บันทึก</button>
        </div>
    </div>

    <div class="overlay" id="sidebar-overlay"></div>

    <aside id="sidebar" class="hidden md:flex">
        <div class="p-3">
            <button id="new-chat-btn"
                class="flex items-center gap-2 w-full p-3 rounded-lg text-sm font-medium transition-colors"
                style="background:var(--hover);color:var(--text);border:1px solid var(--border);">
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M12 4a1 1 0 011 1v6h6a1 1 0 110 2h-6v6a1 1 0 11-2 0v-6H5a1 1 0 110-2h6V5a1 1 0 011-1z"
                        fill="currentColor" />
                </svg>
                <span>New chat</span>
                <span class="ml-auto text-xs px-2 py-0.5 rounded-md"
                    style="border:1px solid var(--border);color:var(--text2);">Ctrl K</span>
            </button>
        </div>

        <div id="chat-list" class="flex-1 overflow-y-auto no-sb p-3 pt-0"></div>

        <div class="p-3" style="border-top:1px solid var(--border);">
            <div id="user-profile" class="flex items-center gap-3 p-2 rounded-lg cursor-pointer transition-colors"
                style="color:var(--text);">
                <div id="user-avatar"
                    class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm"
                    style="background:var(--btn-primary); color:var(--btn-text);">?</div>
                <div class="flex-1 min-w-0">
                    <div id="user-name" class="text-sm font-medium truncate">Guest</div>
                </div>
                <button id="logout-btn" title="ออกจากระบบ" class="p-1 rounded-md transition-colors"
                    style="color:var(--text2);">
                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" />
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen relative">
        <header class="h-14 flex items-center justify-between px-4 sticky top-0 z-10"
            style="background:var(--bg);border-bottom:1px solid var(--border);">
            <button id="mobile-menu-btn" class="md:hidden" style="color:var(--text2);">
                <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <div class="relative">
                <button id="model-btn"
                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg transition-colors text-sm font-semibold"
                    style="color:var(--text);">
                    <span id="model-label">GPT-4o</span>
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </button>
                <div id="model-menu"></div>
            </div>
            <button id="api-key-edit-btn" title="แก้ไข API Key" class="p-2 rounded-lg transition-colors"
                style="color:var(--text2);">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M15 7a4 4 0 11-8 0 4 4 0 018 0zM5 21a7 7 0 0114 0" />
                    <path d="M21 11l-2 2m0 0l-2-2m2 2V7" />
                </svg>
            </button>
        </header>

        <div id="chat-area" class="flex-1 overflow-y-auto no-sb px-4">
            <div id="welcome" class="flex flex-col items-center justify-center h-full pb-20">
                <div
                    style="width:64px;height:64px;background:#fff;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
                    <svg width="32" height="32" fill="none" viewBox="0 0 24 24">
                        <path d="M12 2a7 7 0 017 7c0 3-2 5.4-4.8 6.5L15 22H9l.8-6.5C7 14.4 5 12 5 9a7 7 0 017-7z"
                            fill="#000" />
                    </svg>
                </div>
                <h1 class="text-2xl font-semibold" style="color:var(--text);">วันนี้ช่วยอะไรได้บ้าง?</h1>
                <p class="mt-2 text-sm" style="color:var(--text2);">เลือกโมเดลด้านบน แล้วเริ่มพิมพ์ข้อความได้เลย</p>
            </div>
            <div id="messages"></div>
        </div>

        <div class="w-full pb-5 pt-2 px-4">
            <div class="max-w-3xl mx-auto">
                <div class="flex flex-col px-3 py-3 rounded-2xl transition-all"
                    style="background:var(--input);border:1px solid var(--border);" id="input-wrapper">
                    <textarea id="msg-input" placeholder="พิมพ์ข้อความ..."
                        class="w-full bg-transparent resize-none outline-none max-h-48 px-2 py-1 text-sm"
                        style="color:var(--text);" rows="1"></textarea>
                    <div class="flex items-center justify-end mt-2 px-1">
                        <button id="send-btn" class="p-2 rounded-full transition-colors"
                            style="background:var(--btn-primary);color:var(--btn-text);">
                            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13" />
                                <polygon points="22 2 15 22 11 13 2 9 22 2" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="text-center text-xs mt-3" style="color:var(--text2);">AI อาจให้ข้อมูลผิดพลาดได้
                    กรุณาตรวจสอบข้อมูลสำคัญ</div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
